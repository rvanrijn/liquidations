[project]
name = "liquidations"
version = "0.1.0"
description = "Real-time multi-exchange liquidation dashboard"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "python-kraken-sdk>=2.0.0",
    "pybit>=5.6.0",
    "python-okx>=0.4.0",
    "hyperliquid-python-sdk>=0.22.0",
    "eth-account>=0.11.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
liq-dashboard = "src.main:main"
orderflow = "src.orderflow.main:main"
liqlevels = "src.liqlevels.main:main"
scalper = "src.scalper.main:main"
scalper-backtest = "src.scalper.backtest:main"
liqhunt = "src.liqhunt.main:main"
liqbot = "src.krakenbot.main:main"
krakenbot-backtest = "src.krakenbot.backtest:main"
bybitbot = "src.bybitbot.main:main"
hlbot = "src.hlbot.main:main"
deribitbot = "src.deribitbot.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
