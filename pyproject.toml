[project]
name = "liquidations"
version = "0.1.0"
description = "Real-time multi-exchange liquidation dashboard"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
liq-dashboard = "src.main:main"
orderflow = "src.orderflow.main:main"
liqlevels = "src.liqlevels.main:main"
scalper = "src.scalper.main:main"
scalper-backtest = "src.scalper.backtest:main"
liqhunt = "src.liqhunt.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
